# .github/labeler.yml
# 为 actions/labeler 定义标签规则

# 文档相关的标签
documentation:
  - changed-files:
    - any-glob-to-any-file:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'assets/documents/**/*.md'

# CI/CD 工作流相关的标签
cicd:
  - changed-files:
    - any-glob-to-any-file: '.github/workflows/*'

# 提示词相关的标签
prompt:
  - changed-files:
    - any-glob-to-any-file: 'assets/prompts/**/*.md'

# 实战案例相关的标签
example:
  - changed-files:
    - any-glob-to-any-file: 'assets/documents/case-studies/**/*.md'
