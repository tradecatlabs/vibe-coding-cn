# .github/labeler.yml
# 为 actions/labeler 定义标签规则

# 文档相关的标签
documentation:
  - changed-files:
    - any-glob-to-any-file:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'LICENSE'
      - '.github/**/*.md'
      - '.github/context/**/*.md'
      - '.github/skills/**/*.md'
      - '.github/extensions/**/*.md'

# CI/CD 工作流相关的标签
cicd:
  - changed-files:
    - any-glob-to-any-file: '.github/workflows/*'

# 提示词相关的标签
prompt:
  - changed-files:
    - any-glob-to-any-file: '.github/context-prompts-*.md'

# 外部工具/依赖相关的标签
repos:
  - changed-files:
    - any-glob-to-any-file: '.github/extensions/**'
