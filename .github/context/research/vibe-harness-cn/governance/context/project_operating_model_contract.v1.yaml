validation:
  operator_pack_core: uv run --locked --script scripts/validate_harness.py --operator-pack contracts/examples/minimal-operator-pack.json
  operator_library: uv run --locked --script scripts/validate_harness.py --operator-library operators/catalog.json
  operator_runtime_core: uv run --locked --script scripts/validate_harness.py --operator-runtime contracts/examples/minimal-operator-binding.json contracts/examples/minimal-operator-run-request.json contracts/examples/minimal-operator-run-record.json
  reference_operator_harness: python3 -m unittest tests.test_reference_operator_harness
  upstream_sync: bash scripts/sync_upstreams.sh
  upstream_regression: bash tests/test_sync_upstreams.sh
  governance_validate: python3 governance/tools/validate_governance_package.py --project-root . --strict
  context_bundle_docs: python3 governance/tools/governance_context_bundle.py --project-root . --task-type docs
