{
  "schema_version": "1.0.0",
  "policy_id": "meta-harness-verification-policy",
  "owner": "engineering",
  "mode": "enforce",
  "capability_registry": "governance/control-plane/verification-capabilities.v1.yaml",
  "risk_profiles": {
    "low": {
      "required": ["contract"],
      "conditional": [
        {"capability": "behavior", "when": "behavior_required"}
      ],
      "not_applicable": []
    },
    "medium": {
      "required": ["contract", "test", "architecture"],
      "conditional": [
        {"capability": "behavior", "when": "behavior_required"},
        {"capability": "security", "when": "security_changed"}
      ],
      "not_applicable": []
    },
    "high": {
      "required": ["contract", "test", "architecture", "security", "rollback"],
      "conditional": [
        {"capability": "behavior", "when": "behavior_required"}
      ],
      "not_applicable": []
    }
  },
  "waivers": []
}
