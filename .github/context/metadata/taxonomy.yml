  - path: .github/context/gongfa/README.md#doc-problem-solving
    title: 问题求解
    role: 目标、现状、差距、标准、约束、对象与路径
  - path: .github/context/gongfa/README.md#doc-thinking-models
    title: 思维模型
    role: 第一性原理、奥卡姆剃刀、多阶思维、状态空间等认知工具
