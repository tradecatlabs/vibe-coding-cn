version: 1
domain_id: openai-cookbook
object:
  type: github_repository
  name: openai/openai-cookbook
  url: https://github.com/openai/openai-cookbook
pulled_at: '2026-09-08T11:14:14+00:00'
puller: .github/scripts/fetch-research-raw.py
files:
  - path: repository/
    kind: git-working-tree
    status: ok
    source: 'git clone --depth=1 --single-branch --no-tags https://github.com/openai/openai-cookbook.git research/openai-cookbook/raw/repository'
  - path: github-repo.raw.json
    kind: repository-metadata
    status: ok
    source: 'gh repo view openai/openai-cookbook --json nameWithOwner,url,description,homepageUrl,isArchived,isFork,isMirror,defaultBranchRef,licenseInfo,primaryLanguage,repositoryTopics,stargazerCount,forkCount,watchers,createdAt,updatedAt,pushedAt,latestRelease --jq .'
  - path: github-readme.raw.md.txt
    kind: readme
    status: ok
    source: 'gh api repos/openai/openai-cookbook/readme -H Accept: application/vnd.github.raw'
  - path: github-license.raw.txt
    kind: license
    status: ok
    source: 'gh api repos/openai/openai-cookbook/license -H Accept: application/vnd.github.raw'
  - path: github-root-contents.raw.json
    kind: root-contents
    status: ok
    source: 'gh api repos/openai/openai-cookbook/contents'
  - path: github-languages.raw.json
    kind: languages
    status: ok
    source: 'gh api repos/openai/openai-cookbook/languages'
  - path: github-latest-release.raw.json
    kind: latest-release
    status: missing_or_error
    source: 'gh api repos/openai/openai-cookbook/releases/latest'
    message: 'gh: Not Found (HTTP 404)'
