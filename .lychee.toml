# Lychee link checker configuration for GitHub Actions.
#
# 仓内链接由.github/extensions/check-local-links.py检查；此处保持原网络检查边界。
# Lychee is reserved for public external links and first-party Markdown that should
# be visible to readers. Generated tools, external snapshots and login-only pages
# are excluded here instead of being repeated in workflow YAML.

timeout = 20
max_retries = 3
retry_wait_time = 2
max_concurrency = 32

exclude_path = [
  '^\.history(/|$)',
  '^\.github/wiki(/|$)',
  '^node_modules(/|$)',
  '^\.github/extensions/(Skill_Seekers-development|claude-official-skills|tmux|oh-my-tmux|MCPlayerTransfer|XHS-image-to-PDF-conversion|my-nvim)(/|$)',
  '^\.github/extensions/html-tools-main\.md$',
  '^\.github/extensions/chat-vault(/|$)',
  # These research projects have independent link-checking contracts and are
  # intentionally excluded from the root repository's first-party scan.
  '^\.github/context/research/vibe-cybersecurity-cn(/|$)',
  '^\.github/context/research/vibe-harness-cn(/|$)',
  '^\.github/context/research/vibe-mathing-cn-public(/|$)',
  '^\.github/extensions/prompts-library(/|$)',
  '^\.github/skills/(algorithmic-art|brand-guidelines|canvas-design|doc-coauthoring|docx|frontend-design|internal-comms|mcp-builder|pdf|pptx|skill-creator|slack-gif-creator|theme-factory|web-artifacts-builder|webapp-testing|xlsx)(/|$)',
  '^\.github/skills/auto-tmux/assets/(oh-my-tmux|tmux-src)(/|$)',
]

exclude = [
  # ISO's official catalogue returns 403 to GitHub Actions; retain the canonical
  # citations while excluding only these exact URLs from automated HTTP checks.
  '^https://www\.iso\.org/standard/27001$',
  '^https://www\.iso\.org/standard/70636\.html$',
  '^https://www\.iso\.org/standard/74393\.html$',
  '^https://www\.iso\.org/standard/75106\.html$',
  '^https://www\.iso\.org/standard/78176\.html$',
  '^https://www\.iso\.org/standard/81230\.html$',
  '^https://www\.iso\.org/standard/81291\.html$',
  '^https://www\.iso\.org/standard/81684\.html$',
  '^https://chatgpt\.com.*',
  '^https://claude\.ai.*',
  '^https://app\.augmentcode\.com.*',
  '^https://platform\.openai\.com.*',
  '^https://openai\.com/index/.*',
  '^https://user-images\.githubusercontent\.com.*',
  '^https://notebooklm\.google\.com.*',
  '^https://zread\.ai/.*',
  '^https://api\.star-history\.com/.*',
  '^https://philpapers\.org/rec/GOOSCT$',
  '^https://www\.contributor-covenant\.org.*',
  '^https://javabetter\.cn/.*',
  '^https://xn--9kqz23b19z\.com/.*',
  '^https://opencode\.ai/go\?ref=FF7EBR5TKW.*',
  '^https://www\.bybit\.com/.*',
  # 外部站点风控/TLS/限流导致 runner 上不稳定，属于既有失败类。
  '^https://x\.com/.*',
  '^https://opencode\.ai/docs/%E3%80%82$',
  '^https://windsurf\.com/.*',
  '^https://www\.lesswrong\.com/.*',
]
